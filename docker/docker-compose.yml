services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: devops_stored_data_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-generate-a-strong-jwt-secret-in-production}
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/backend/data/devops_stored.sqlite
      - UPLOADS_DIR=/app/backend/uploads
      - CORS_ORIGIN=https://devops.example.com
      - MAX_FILE_SIZE=52428800
    volumes:
      - devops_data:/app/backend/data
      - devops_uploads:/app/backend/uploads
    networks:
      - devops_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: devops_stored_data_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - devops_net

  certbot:
    image: certbot/certbot
    container_name: devops_stored_data_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - devops_net

volumes:
  devops_data:
    driver: local
  devops_uploads:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  devops_net:
    driver: bridge
